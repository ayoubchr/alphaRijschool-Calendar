<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, Helvetica, sans-serif">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <!-- background blob -->
  <path d="M70 330 C60 170 200 80 420 85 L860 85 C1080 80 1230 170 1215 360 C1205 520 1120 630 900 630 L260 630 C120 630 80 480 70 330 Z" fill="#D6EAF8"/>

  <!-- plants -->
  <g fill="#5AA9F0">
    <ellipse cx="95" cy="430" rx="45" ry="110" transform="rotate(-25 95 430)"/>
    <ellipse cx="150" cy="380" rx="40" ry="120" transform="rotate(5 150 380)"/>
    <ellipse cx="60" cy="520" rx="35" ry="80" transform="rotate(-55 60 520)"/>
    <ellipse cx="1185" cy="440" rx="45" ry="110" transform="rotate(25 1185 440)"/>
    <ellipse cx="1135" cy="390" rx="40" ry="115" transform="rotate(-8 1135 390)"/>
    <ellipse cx="1220" cy="530" rx="35" ry="80" transform="rotate(55 1220 530)"/>
  </g>
  <g fill="#3A7FD0" opacity="0.5">
    <ellipse cx="150" cy="350" rx="6" ry="14"/><ellipse cx="150" cy="400" rx="6" ry="14"/>
    <ellipse cx="1135" cy="360" rx="6" ry="14"/><ellipse cx="1135" cy="410" rx="6" ry="14"/>
  </g>

  <!-- board -->
  <rect x="330" y="100" width="580" height="350" fill="#FFFFFF"/>
  <path d="M870 110 L910 110 L910 440 L840 450 Z" fill="#EEF4FA"/>
  <rect x="318" y="88" width="604" height="22" rx="11" fill="#F2455C"/>
  <rect x="330" y="92" width="400" height="5" rx="2.5" fill="#FF8A99"/>

  <!-- row 1 col 1: give way -->
  <rect x="365" y="125" width="150" height="140" rx="6" fill="#F4F4F6"/>
  <path d="M385 150 L495 150 L440 245 Z" fill="#F2455C" stroke-linejoin="round"/>
  <path d="M405 162 L475 162 L440 223 Z" fill="#FFFFFF"/>
  <!-- row 1 col 2: no entry -->
  <rect x="545" y="125" width="150" height="140" rx="6" fill="#F4F4F6"/>
  <circle cx="620" cy="195" r="55" fill="#F2455C"/>
  <rect x="585" y="186" width="70" height="18" rx="3" fill="#FFFFFF"/>
  <!-- row 1 col 3: pedestrian crossing -->
  <rect x="725" y="125" width="150" height="140" rx="6" fill="#F4F4F6"/>
  <path d="M800 140 L860 245 L740 245 Z" fill="#F2455C" stroke="#F2455C" stroke-width="10" stroke-linejoin="round"/>
  <path d="M800 162 L843 235 L757 235 Z" fill="#FFFFFF"/>
  <g fill="#1E2A5A">
    <rect x="775" y="226" width="7" height="6"/><rect x="788" y="226" width="7" height="6"/><rect x="801" y="226" width="7" height="6"/><rect x="814" y="226" width="7" height="6"/>
    <circle cx="802" cy="185" r="5"/>
    <path d="M800 192 L806 192 L808 210 L815 222 L810 224 L802 212 L795 224 L790 222 L797 208 Z"/>
  </g>

  <!-- row 2 col 1: roundabout -->
  <circle cx="440" cy="355" r="55" fill="#3A3FC4"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="8">
    <path d="M440 322 A33 33 0 0 1 468 372"/>
    <path d="M459 383 A33 33 0 0 1 409 368"/>
    <path d="M411 344 A33 33 0 0 1 425 326"/>
  </g>
  <g fill="#FFFFFF">
    <path d="M428 314 L446 322 L430 334 Z"/>
    <path d="M478 366 L466 382 L460 364 Z"/>
    <path d="M404 380 L402 360 L418 370 Z"/>
  </g>
  <!-- row 2 col 2: no overtaking -->
  <circle cx="620" cy="355" r="55" fill="#FFFFFF" stroke="#F2455C" stroke-width="12"/>
  <g>
    <rect x="585" y="345" width="30" height="22" rx="5" fill="#F2455C"/>
    <rect x="590" y="337" width="20" height="12" rx="4" fill="#F2455C"/>
    <rect x="625" y="345" width="30" height="22" rx="5" fill="#1E2A5A"/>
    <rect x="630" y="337" width="20" height="12" rx="4" fill="#1E2A5A"/>
  </g>
  <!-- row 2 col 3: speed 30 -->
  <circle cx="800" cy="355" r="55" fill="#FFFFFF" stroke="#F2455C" stroke-width="12"/>
  <text x="800" y="373" font-size="50" font-weight="bold" fill="#1E2A5A" text-anchor="middle">30</text>

  <!-- stop sign post (right) -->
  <rect x="1082" y="250" width="12" height="360" fill="#1E2A5A"/>
  <rect x="1068" y="600" width="40" height="12" rx="4" fill="#1E2A5A"/>
  <g transform="translate(1088 215)">
    <polygon points="-29,-70 29,-70 70,-29 70,29 29,70 -29,70 -70,29 -70,-29" fill="#FFFFFF"/>
    <polygon points="-25,-62 25,-62 62,-25 62,25 25,62 -25,62 -62,25 -62,-25" fill="#F2455C"/>
    <text x="0" y="12" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">STOP</text>
  </g>

  <!-- instructor (right) -->
  <g>
    <rect x="945" y="480" width="38" height="140" rx="10" fill="#1E2A5A"/>
    <rect x="988" y="480" width="38" height="140" rx="10" fill="#1E2A5A"/>
    <path d="M930 360 Q985 320 1040 360 L1045 495 L925 495 Z" fill="#3A3FC4"/>
    <!-- right arm down -->
    <path d="M1035 365 Q1060 420 1050 480" stroke="#3A3FC4" stroke-width="30" fill="none" stroke-linecap="round"/>
    <circle cx="1050" cy="490" r="13" fill="#F4A582"/>
    <!-- left arm pointing toward board -->
    <path d="M940 370 Q900 390 860 360" stroke="#3A3FC4" stroke-width="30" fill="none" stroke-linecap="round"/>
    <path d="M848 345 L815 335 Q805 345 815 352 L846 368 Z" fill="#F4A582"/>
    <!-- collar, neck, head -->
    <rect x="973" y="315" width="24" height="30" fill="#F4A582"/>
    <path d="M962 340 Q985 355 1008 340" stroke="#FFFFFF" stroke-width="8" fill="none" stroke-linecap="round"/>
    <ellipse cx="985" cy="285" rx="36" ry="42" fill="#F4A582"/>
    <circle cx="949" cy="290" r="8" fill="#F4A582"/><circle cx="1021" cy="290" r="8" fill="#F4A582"/>
    <path d="M948 280 Q945 235 985 238 Q1030 236 1022 280 Q1015 258 990 258 Q965 262 948 280 Z" fill="#F2C94C"/>
    <circle cx="972" cy="285" r="3.5" fill="#1E2A5A"/><circle cx="998" cy="285" r="3.5" fill="#1E2A5A"/>
    <path d="M970 305 Q985 318 1000 305" stroke="#1E2A5A" stroke-width="3" fill="#FFFFFF" stroke-linecap="round"/>
  </g>

</svg>
